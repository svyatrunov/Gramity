<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Gramity</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      try {
        var tgEarly = window.Telegram && window.Telegram.WebApp;
        if (tgEarly) {
          tgEarly.ready();
          tgEarly.expand();
          if (tgEarly.disableClosingConfirmation) tgEarly.disableClosingConfirmation();
          if (tgEarly.BackButton) tgEarly.BackButton.hide();
          if (tgEarly.themeParams && tgEarly.themeParams.bg_color) {
            document.documentElement.style.setProperty('--tg-theme-bg', tgEarly.themeParams.bg_color);
          }
        }
      } catch (e) {
        console.error('[TG] WebApp init failed:', e);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
